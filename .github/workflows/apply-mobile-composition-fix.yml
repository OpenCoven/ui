name: Apply mobile composition fix

on:
  push:
    branches:
      - fix/specimen-browser-shell

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply constrained responsive patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              target = Path(path)
              source = target.read_text()
              if before not in source:
                  raise SystemExit(f"Anchor not found in {path}: {before!r}")
              target.write_text(source.replace(before, after, 1))

          replace_once(
              "packages/ui/src/blocks/session-header.tsx",
              '"flex min-w-0 flex-wrap items-center gap-3 border-b border-border bg-card px-4 py-3",',
              '"flex min-w-0 flex-wrap items-center gap-x-3 gap-y-2 border-b border-border bg-card px-4 py-3",',
          )
          replace_once(
              "packages/ui/src/blocks/session-header.tsx",
              '<span className="min-w-0 flex-1">',
              '<span className="min-w-0 basis-full flex-1 sm:basis-auto">',
          )

          replace_once(
              "packages/ui/src/blocks/transcript-turn.tsx",
              '"relative grid gap-4 border-s-2 border-s-presence/55 ps-5",',
              '"relative grid min-w-0 gap-4 border-s-2 border-s-presence/55 ps-5",',
          )
          replace_once(
              "packages/ui/src/blocks/transcript-turn.tsx",
              '<header className="flex items-center gap-3">',
              '<header className="flex min-w-0 items-center gap-3">',
          )
          replace_once(
              "packages/ui/src/blocks/transcript-turn.tsx",
              'className="grid size-9 place-items-center rounded-md border border-presence/35 bg-presence/12 text-sm font-bold text-presence"',
              'className="grid size-9 shrink-0 place-items-center rounded-md border border-presence/35 bg-presence/12 text-sm font-bold text-presence"',
          )
          replace_once(
              "packages/ui/src/blocks/transcript-turn.tsx",
              '<span className="min-w-0">',
              '<span className="min-w-0 flex-1">',
          )
          replace_once(
              "packages/ui/src/blocks/transcript-turn.tsx",
              '<div className="editorial max-w-prose text-[1.05rem] leading-7">',
              '<div className="editorial min-w-0 max-w-prose break-words text-[1.05rem] leading-7">',
          )
          replace_once(
              "packages/ui/src/blocks/transcript-turn.tsx",
              'className="flex gap-3 text-xs text-muted-foreground"',
              'className="flex min-w-0 flex-wrap gap-3 text-xs text-muted-foreground"',
          )

          replace_once(
              "apps/specimens/src/specimens.css",
              ".assembled-lab__tabs {\n  width: max-content;\n  min-width: 100%;\n}",
              ".assembled-lab__tabs {\n  width: max-content;\n  min-width: 0;\n}\n\n.assembled-lab__tabs [data-slot=\"tabs-trigger\"] {\n  flex: none;\n}",
          )
          replace_once(
              "apps/specimens/src/specimens.css",
              ".assembled-lab__stage {\n  display: grid;",
              ".assembled-lab [data-slot=\"tabs\"],\n.assembled-lab__stage,\n.lab-composer,\n.lab-message-stack {\n  min-width: 0;\n}\n\n.assembled-lab__stage {\n  display: grid;",
          )
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/specimens/src/specimens.css packages/ui/src/blocks/session-header.tsx packages/ui/src/blocks/transcript-turn.tsx
      - name: Commit responsive fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/specimens/src/specimens.css packages/ui/src/blocks/session-header.tsx packages/ui/src/blocks/transcript-turn.tsx
          git commit -m "fix(blocks): prevent mobile composition clipping"
          git push origin HEAD:fix/specimen-browser-shell
