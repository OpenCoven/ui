name: Format receipt

on:
  push:
    branches:
      - fix/specimen-browser-shell

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/specimens/src/app.tsx scripts/verify-contracts.mjs
      - name: Commit canonical formatting
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/specimens/src/app.tsx scripts/verify-contracts.mjs
          if git diff --cached --quiet; then
            echo "Source is already formatted."
            exit 0
          fi
          git commit -m "style(specimens): apply canonical formatting"
          git push origin HEAD:fix/specimen-browser-shell
