name: Format developer connection once

on:
  push:
    branches:
      - feat/developer-surface-system

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/developer-surface-system

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format source and regenerate registry output
        run: |
          pnpm exec prettier --write packages/ui/src/components/connection-status.tsx
          pnpm registry:build

      - name: Verify all non-clean-tree gates
        run: >-
          pnpm format:check &&
          pnpm lint &&
          pnpm typecheck &&
          pnpm test &&
          pnpm contracts:check &&
          pnpm registry:validate &&
          pnpm test:consumer &&
          pnpm build &&
          pnpm deploy:check &&
          pnpm package:check

      - name: Commit deterministic formatter and registry output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- apps/specimens/tsconfig.tsbuildinfo 2>/dev/null || true
          git rm .github/workflows/format-developer-connection-once.yml
          git add \
            packages/ui/src/components/connection-status.tsx \
            registry.json \
            public/r
          git commit -m "style(developer): apply repository formatter"
          git push origin HEAD:feat/developer-surface-system
