name: Materialize visual review

on:
  push:
    branches:
      - test/specimen-visual-review

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize visual-review sources
        env:
          VISUAL_REVIEW_MJS: 
          VISUAL_REVIEW_MD: 
        run: |
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          sources = {
              "scripts/visual-review.mjs": os.environ["VISUAL_REVIEW_MJS"],
              "handoffs/visual-review.md": os.environ["VISUAL_REVIEW_MD"],
          }

          for target, encoded in sources.items():
              path = Path(target)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/visual-review.mjs handoffs/visual-review.md
      - run: node --check scripts/visual-review.mjs
      - name: Commit visual-review sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/visual-review.mjs handoffs/visual-review.md
          git commit -m "test(specimens): add viewport visual receipts"
          git push origin HEAD:test/specimen-visual-review
