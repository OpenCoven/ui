name: Mark verified stacked PRs ready once

on:
  push:
    branches:
      - test/specimen-visual-review

permissions:
  contents: write
  pull-requests: write

jobs:
  ready:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: test/specimen-visual-review

      - name: Mark PRs 2 and 3 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pr in 2 3; do
            pull_request_id="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq .node_id)"
            gh api graphql \
              -f query='mutation($id: ID!) { markPullRequestReadyForReview(input: { pullRequestId: $id }) { pullRequest { number isDraft } } }' \
              -F id="$pull_request_id"
          done

      - name: Remove helper and publish clean branch head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mark-stacked-prs-ready-once.yml
          git commit -m "chore(pr): mark stacked reviews ready"
          git push origin HEAD:test/specimen-visual-review
