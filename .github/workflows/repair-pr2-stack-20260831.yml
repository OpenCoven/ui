name: Repair PR 2 stack

on:
  push:
    branches:
      - test/specimen-visual-review

permissions:
  contents: write

concurrency:
  group: repair-pr2-stack
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: test/specimen-visual-review
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: stable

      - name: Rebuild PR 2 from the latest PR 1 tree
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/specimen-browser-shell test/specimen-visual-review

          old_head="$(git rev-parse origin/test/specimen-visual-review)"
          base_head="$(git rev-parse origin/fix/specimen-browser-shell)"

          git checkout --detach "$base_head"

          preserve=(
            .github/workflows/visual-review.yml
            handoffs/visual-review.md
            scripts/visual-review.mjs
            scripts/mobile-quality-review.mjs
          )

          for path in "${preserve[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$old_head:$path" > "$path"
          done

          rm -f .github/workflows/repair-pr2-stack-20260831.yml

          pnpm install --frozen-lockfile
          pnpm exec prettier --write "${preserve[@]}"
          node --check scripts/visual-review.mjs
          node --check scripts/mobile-quality-review.mjs

          git add -A
          tree="$(git write-tree)"
          merge_commit="$(printf '%s\n' 'chore(stack): rebuild visual receipts on verified shell' | git commit-tree "$tree" -p "$old_head" -p "$base_head")"

          git checkout --detach "$merge_commit"
          pnpm check

          rm -rf artifacts/visual-review artifacts/mobile-quality
          mkdir -p artifacts/visual-review artifacts/mobile-quality
          preview_log="$RUNNER_TEMP/specimens-preview.log"
          pnpm --filter @opencoven/specimens preview --host 127.0.0.1 --port 4173 >"$preview_log" 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              ready=true
              break
            fi
            sleep 0.1
          done
          if [[ "$ready" != "true" ]]; then
            cat "$preview_log"
            exit 1
          fi

          node scripts/visual-review.mjs
          node scripts/mobile-quality-review.mjs

          git push origin "$merge_commit":refs/heads/test/specimen-visual-review
