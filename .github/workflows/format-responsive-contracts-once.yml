name: Format responsive contracts once

on:
  push:
    branches:
      - fix/specimen-browser-shell

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/specimen-browser-shell
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier scripts/verify-contracts.mjs --write
      - name: Commit formatter output and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-responsive-contracts-once.yml
          git add scripts/verify-contracts.mjs
          git commit -m "style(contracts): apply repository formatter"
          git push origin HEAD:fix/specimen-browser-shell
