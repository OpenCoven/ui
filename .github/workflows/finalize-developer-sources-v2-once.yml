name: Finalize developer source fixes v2

on:
  push:
    branches:
      - feat/developer-surface-system

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/developer-surface-system

      - name: Remove superseded one-shot helpers and staging markers
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/finalize-developer-sources-once.yml \
            .github/workflows/finalize-developer-surface-once.yml \
            .github/workflows/repair-finalizer-once.yml \
            scripts/.developer-finalization-plan.txt \
            scripts/.atomic-write-guard \
            scripts/.ignore-this-marker \
            scripts/.last-staging-marker \
            scripts/.do-not-repeat \
            scripts/.atomic-source-update \
            scripts/.cleanup-in-next-commit \
            scripts/.transient-staging-6 \
            scripts/.transient-cleanup-marker

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format touched source
        run: >-
          pnpm exec prettier --write
          apps/specimens/src/main.tsx
          apps/specimens/src/developer-showcase.tsx
          packages/ui/tsconfig.json
          packages/ui/src/blocks/developer-surface.tsx
          packages/ui/src/components/connection-status.tsx
          packages/ui/src/components/command-receipt.tsx

      - name: Regenerate installable registry artifacts
        run: pnpm registry:build

      - name: Verify source, package, consumer, and deployment contracts
        run: >-
          pnpm format:check &&
          pnpm lint &&
          pnpm typecheck &&
          pnpm test &&
          pnpm contracts:check &&
          pnpm registry:validate &&
          pnpm test:consumer &&
          pnpm build &&
          pnpm deploy:check &&
          pnpm package:check

      - name: Publish deterministic source and registry output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- apps/specimens/tsconfig.tsbuildinfo 2>/dev/null || true
          git rm .github/workflows/finalize-developer-sources-v2-once.yml
          git add \
            apps/specimens/src/main.tsx \
            apps/specimens/src/developer-showcase.tsx \
            packages/ui/tsconfig.json \
            packages/ui/src/blocks/developer-surface.tsx \
            packages/ui/src/components/connection-status.tsx \
            packages/ui/src/components/command-receipt.tsx \
            registry.json \
            public/r
          git commit -m "fix(developer): preserve preferences and reflow at text zoom"
          git push origin HEAD:feat/developer-surface-system
