name: Repair developer finalizer once

on:
  push:
    branches:
      - feat/developer-surface-system

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/developer-surface-system
      - name: Make the finalizer structural and bot-runnable
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/finalize-developer-surface-once.yml")
          source = path.read_text()

          source = source.replace(
              "    if: github.actor != 'github-actions[bot]'\n",
              "",
              1,
          )

          before = '''          replace_once(
              "packages/ui/tsconfig.json",
              '''\'''    "paths": {
                  "@opencoven/ui/*": ["./src/*"]
                },'''\''',
              '''\'''    "paths": {
                  "@opencoven/ui": ["./src/index.ts"],
                  "@opencoven/ui/*": ["./src/*"]
                },'''\''',
          )'''
          after = '''          replace_once(
              "packages/ui/tsconfig.json",
              '''\'''    "paths": {
      "@opencoven/ui/*": ["./src/*"]
    },'''\''',
              '''\'''    "paths": {
      "@opencoven/ui": ["./src/index.ts"],
      "@opencoven/ui/*": ["./src/*"]
    },'''\''',
          )'''

          if before not in source:
              raise SystemExit("Finalizer tsconfig anchor was not found")

          path.write_text(source.replace(before, after, 1))
          PY
      - name: Commit repair and remove this helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-finalizer-once.yml
          git add .github/workflows/finalize-developer-surface-once.yml
          git commit -m "chore(ci): make developer finalizer robust"
          git push origin HEAD:feat/developer-surface-system
