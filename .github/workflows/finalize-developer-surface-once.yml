              '        <section className="grid min-w-0 gap-8 border-b border-border pb-10 lg:grid-cols-[minmax(0,1fr)_22rem] lg:items-end">',
          )
          replace_once(
              "apps/specimens/src/developer-showcase.tsx",
              '          <div>\n            <p className="numeric m-0 text-[0.625rem] font-semibold tracking-[0.14em] text-presence uppercase">',
