name: Finalize developer surface once

on:
  push:
    branches:
      - feat/developer-surface-system

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/developer-surface-system
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch package resolution, persisted presentation state, and text-zoom reflow
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              target = Path(path)
              source = target.read_text()
              if before not in source:
                  raise SystemExit(f"Anchor not found in {path}: {before[:120]!r}")
              target.write_text(source.replace(before, after, 1))

          def replace_all(path: str, before: str, after: str, expected: int) -> None:
              target = Path(path)
              source = target.read_text()
              count = source.count(before)
              if count != expected:
                  raise SystemExit(
                      f"Expected {expected} anchors in {path}, found {count}: {before[:120]!r}"
                  )
              target.write_text(source.replace(before, after))

          replace_once(
              "packages/ui/tsconfig.json",
              '''    "paths": {
                  "@opencoven/ui/*": ["./src/*"]
                },''',
              '''    "paths": {
                  "@opencoven/ui": ["./src/index.ts"],
                  "@opencoven/ui/*": ["./src/*"]
                },''',
          )

          replace_once(
              "apps/specimens/src/main.tsx",
              '''const normalizedPath = window.location.pathname.replace(/\\/+$/, "") || "/";

          if (normalizedPath !== "/") {''',
              '''const normalizedPath = window.location.pathname.replace(/\\/+$/, "") || "/";
          const storedScheme =
            localStorage.getItem("coven-ui:scheme") === "light" ? "light" : "dark";
          const storedDensity =
            localStorage.getItem("coven-ui:density") === "compact"
              ? "compact"
              : "default";

          document.documentElement.classList.toggle("dark", storedScheme === "dark");
          document.documentElement.dataset.density = storedDensity;

          if (normalizedPath !== "/") {''',
          )

          replace_once(
              "apps/specimens/src/developer-showcase.tsx",
              '        <div className="mx-auto flex min-h-16 max-w-7xl items-center gap-3 px-4 sm:px-6">',
              '        <div className="mx-auto grid min-h-16 max-w-7xl grid-cols-[minmax(0,1fr)_auto] items-center gap-2 px-4 sm:flex sm:gap-3 sm:px-6">',
          )
          replace_once(
              "apps/specimens/src/developer-showcase.tsx",
              '''            className="inline-flex items-center gap-2 text-sm font-semibold text-foreground no-underline"
          >
            <ArrowLeft aria-hidden="true" className="size-4" />
            OpenCoven UI''',
              '''            className="inline-flex min-w-0 items-center gap-2 text-sm font-semibold text-foreground no-underline"
          >
            <ArrowLeft aria-hidden="true" className="size-4 shrink-0" />
            <span className="min-w-0 break-words [overflow-wrap:anywhere]">
              OpenCoven UI
            </span>''',
          )
          replace_once(
              "apps/specimens/src/developer-showcase.tsx",
              '          <span className="h-4 w-px bg-border" aria-hidden="true" />',
              '          <span className="hidden h-4 w-px bg-border sm:block" aria-hidden="true" />',
          )
          replace_once(
              "apps/specimens/src/developer-showcase.tsx",
              '          <span className="numeric text-[0.625rem] font-semibold tracking-[0.12em] text-muted-foreground uppercase">',
