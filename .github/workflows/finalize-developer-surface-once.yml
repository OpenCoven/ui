          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '        "overflow-hidden rounded-xl border border-border bg-card text-card-foreground shadow-sm",',
              '        "w-full min-w-0 max-w-full overflow-hidden rounded-xl border border-border bg-card text-card-foreground shadow-sm",',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '      <header className="grid gap-4 border-b border-border px-5 py-4 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-center">',
              '      <header className="grid min-w-0 gap-4 border-b border-border px-5 py-4 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-center">',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '          <span className="numeric inline-flex items-center gap-1.5 text-[0.625rem] font-semibold tracking-[0.12em] text-presence uppercase">',
              '          <span className="numeric inline-flex max-w-full flex-wrap items-center gap-1.5 text-[0.625rem] font-semibold tracking-[0.12em] text-presence uppercase [overflow-wrap:anywhere]">',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '            className="mt-1.5 mb-0 text-lg font-semibold tracking-tight"',
              '            className="mt-1.5 mb-0 min-w-0 text-lg font-semibold tracking-tight break-words [overflow-wrap:anywhere]"',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '          <p className="mt-1 mb-0 max-w-2xl text-xs leading-5 text-muted-foreground">',
              '          <p className="mt-1 mb-0 min-w-0 max-w-2xl text-xs leading-5 break-words text-muted-foreground [overflow-wrap:anywhere]">',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '        {actions ? <div className="flex flex-wrap gap-2">{actions}</div> : null}',
              '        {actions ? (\n          <div className="flex min-w-0 max-w-full flex-wrap gap-2">{actions}</div>\n        ) : null}',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '      <div className="grid min-w-0 lg:grid-cols-[minmax(0,1fr)_20rem]">',
              '      <div className="grid w-full min-w-0 max-w-full lg:grid-cols-[minmax(0,1fr)_20rem]">',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '          <div className="flex min-w-0 flex-wrap items-center gap-x-4 gap-y-2 border-b border-border bg-muted/35 px-5 py-3 text-xs">',
              '          <div className="grid min-w-0 gap-2 border-b border-border bg-muted/35 px-5 py-3 text-xs sm:flex sm:flex-wrap sm:items-center sm:gap-x-4 sm:gap-y-2">',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '            <span className="inline-flex min-w-0 items-center gap-1.5 font-semibold">',
              '            <span className="inline-flex min-w-0 max-w-full items-start gap-1.5 font-semibold">',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '              <Code2 aria-hidden="true" className="size-3.5 text-presence" />\n              <span className="truncate">{project}</span>',
              '              <Code2 aria-hidden="true" className="size-3.5 shrink-0 text-presence" />\n              <span className="min-w-0 break-words [overflow-wrap:anywhere]">\n                {project}\n              </span>',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '              <span className="numeric inline-flex min-w-0 items-center gap-1.5 text-muted-foreground">',
              '              <span className="numeric inline-flex min-w-0 max-w-full items-start gap-1.5 text-muted-foreground">',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '                <GitBranch aria-hidden="true" className="size-3.5" />\n                <span className="truncate">{branch}</span>',
              '                <GitBranch aria-hidden="true" className="size-3.5 shrink-0" />\n                <span className="min-w-0 break-words [overflow-wrap:anywhere]">\n                  {branch}\n                </span>',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '            <header className="flex items-center justify-between gap-3 px-5 pt-5 pb-3">\n              <div>',
              '            <header className="grid min-w-0 gap-2 px-5 pt-5 pb-3 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-end">\n              <div className="min-w-0">',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '                  className="mt-1 mb-0 text-sm font-semibold"\n                >\n                  Connected development context',
              '                  className="mt-1 mb-0 min-w-0 text-sm font-semibold break-words [overflow-wrap:anywhere]"\n                >\n                  Connected development context',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '              <span className="numeric text-[0.625rem] text-muted-foreground">\n                {connections.length}',
              '              <span className="numeric justify-self-start text-[0.625rem] text-muted-foreground sm:justify-self-end">\n                {connections.length}',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '              <div className="grid gap-3 px-5 pb-5 md:grid-cols-2">',
              '              <div className="grid min-w-0 gap-3 px-5 pb-5 md:grid-cols-2">',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '            <header className="flex items-center justify-between gap-3 px-5 pt-5 pb-2">\n              <div>',
              '            <header className="grid min-w-0 gap-2 px-5 pt-5 pb-2 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-end">\n              <div className="min-w-0">',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '                  className="mt-1 mb-0 text-sm font-semibold"\n                >\n                  Recent invocations',
              '                  className="mt-1 mb-0 min-w-0 text-sm font-semibold break-words [overflow-wrap:anywhere]"\n                >\n                  Recent invocations',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '              <span className="numeric text-[0.625rem] text-muted-foreground">\n                {activity.length}',
              '              <span className="numeric justify-self-start text-[0.625rem] text-muted-foreground sm:justify-self-end">\n                {activity.length}',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '              <div className="pb-2">',
              '              <div className="min-w-0 pb-2">',
          )
          replace_once(
              "packages/ui/src/blocks/developer-surface.tsx",
              '          className="min-w-0 border-t border-border bg-muted/25 p-5 lg:border-t-0 lg:border-l"',
              '          className="w-full min-w-0 max-w-full border-t border-border bg-muted/25 p-5 [overflow-wrap:anywhere] [&_*]:min-w-0 lg:border-t-0 lg:border-l"',
          )

          replace_once(
              "packages/ui/src/components/connection-status.tsx",
              '        "grid min-w-0 gap-3 rounded-lg border border-border bg-card p-4 shadow-sm",',
              '        "grid w-full min-w-0 max-w-full gap-3 rounded-lg border border-border bg-card p-4 shadow-sm",',
          )
          replace_once(
              "packages/ui/src/components/connection-status.tsx",
              '      <header className="flex min-w-0 items-start justify-between gap-3">',
              '      <header className="grid min-w-0 gap-2 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-start">',
          )
          replace_once(
