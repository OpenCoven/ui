name: Mobile overflow diagnostic

on:
  push:
    branches:
      - test/specimen-visual-review

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd
        with:
          chrome-version: stable
      - name: Diagnose 390px overflow and tab-panel state
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          pnpm --filter @opencoven/specimens preview --host 127.0.0.1 --port 4173 >/tmp/specimens-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              node scripts/mobile-overflow-diagnostic.mjs
              exit 0
            fi
            sleep 0.1
          done
          cat /tmp/specimens-preview.log
          exit 1
