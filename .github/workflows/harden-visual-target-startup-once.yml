name: Harden visual target startup once

on:
  push:
    branches:
      - test/specimen-visual-review

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: test/specimen-visual-review

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Poll for a real CDP page target and add a regression contract
        run: |
          python - <<'PY'
          from pathlib import Path

          visual = Path("scripts/visual-review.mjs")
          source = visual.read_text()
          before = '''async function waitForJson(url, timeoutMs = 15_000) {
            const deadline = Date.now() + timeoutMs;
            let lastError;

            while (Date.now() < deadline) {
              try {
                const response = await globalThis.fetch(url);
                if (response.ok) {
                  return await response.json();
                }
                lastError = new Error(`${response.status} ${response.statusText}`);
              } catch (error) {
                lastError = error;
              }

              await new Promise((resolve) => setTimeout(resolve, 150));
            }

            throw new Error(
              `Chrome debugging endpoint did not become ready: ${lastError}`,
            );
          }'''
          after = '''async function waitForPageTarget(
            url,
            chromeProcess,
            output,
            timeoutMs = 30_000,
          ) {
            const deadline = Date.now() + timeoutMs;
            let lastObservation = "Chrome debugging endpoint was not reachable";

            while (Date.now() < deadline) {
              if (
                chromeProcess.exitCode !== null ||
                chromeProcess.signalCode !== null
              ) {
                const exit = chromeProcess.signalCode ?? chromeProcess.exitCode;
                const log = output.join("").trim();
                throw new Error(
                  `Chrome exited before exposing a page debugging target (${exit})${
                    log ? `:\\n${log}` : ""
                  }`,
                );
              }

              try {
                const response = await globalThis.fetch(url);
                if (response.ok) {
                  const targets = await response.json();
                  if (Array.isArray(targets)) {
                    const page = targets.find(
                      (target) =>
                        target.type === "page" && target.webSocketDebuggerUrl,
                    );
                    if (page) {
                      return page;
                    }
                    lastObservation = `${targets.length} target(s) available, none page-ready`;
                  } else {
                    lastObservation = "debugging endpoint returned a non-array payload";
                  }
                } else {
                  lastObservation = `${response.status} ${response.statusText}`;
                }
              } catch (error) {
                lastObservation = String(error);
              }

              await new Promise((resolve) => setTimeout(resolve, 150));
            }

            const log = output.join("").trim();
            throw new Error(
              `Chrome did not expose a page debugging target within ${timeoutMs}ms; last observation: ${lastObservation}${
                log ? `\\nChrome output:\\n${log}` : ""
              }`,
            );
          }'''
          if before not in source:
              raise SystemExit("waitForJson anchor not found")
          source = source.replace(before, after, 1)

          before = '''  const targets = await waitForJson(
            `http://127.0.0.1:${debuggingPort}/json/list`,
          );
          const page = targets.find((target) => target.type === "page");

          if (!page?.webSocketDebuggerUrl) {
            throw new Error("Chrome did not expose a page debugging target");
          }'''
          after = '''  const page = await waitForPageTarget(
            `http://127.0.0.1:${debuggingPort}/json/list`,
            chrome,
            chromeOutput,
          );'''
          if before not in source:
              raise SystemExit("page-target startup anchor not found")
          visual.write_text(source.replace(before, after, 1))

          contracts = Path("scripts/verify-contracts.mjs")
          source = contracts.read_text()
          before = '''  specimenMain,
            button,'''
          after = '''  specimenMain,
            visualReview,
            button,'''
          if before not in source:
              raise SystemExit("contract destructuring anchor not found")
          source = source.replace(before, after, 1)

          before = '''  read("apps/specimens/src/main.tsx"),
            read("packages/ui/src/components/ui/button.tsx"),'''
          after = '''  read("apps/specimens/src/main.tsx"),
            read("scripts/visual-review.mjs"),
            read("packages/ui/src/components/ui/button.tsx"),'''
          if before not in source:
              raise SystemExit("contract read anchor not found")
          source = source.replace(before, after, 1)

          before = '''  [
            "specimen chrome avoids decorative gradients",
            !specimenCss.includes("gradient("),
          ],'''
          after = '''  [
            "visual review waits for a real Chrome page target",
            visualReview.includes("async function waitForPageTarget") &&
              visualReview.includes('target.type === "page"') &&
              visualReview.includes("chromeProcess.exitCode !== null") &&
              !visualReview.includes("async function waitForJson"),
          ],
          [
            "specimen chrome avoids decorative gradients",
            !specimenCss.includes("gradient("),
          ],'''
          if before not in source:
              raise SystemExit("contract assertion anchor not found")
          contracts.write_text(source.replace(before, after, 1))
          PY

      - name: Format and verify non-browser gates
        run: |
          pnpm exec prettier --write scripts/visual-review.mjs scripts/verify-contracts.mjs
          pnpm check

      - name: Set up Chrome for focused receipt verification
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: stable

      - name: Run visual and mobile receipt harnesses
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          pnpm --filter @opencoven/specimens preview --host 127.0.0.1 --port 4173 >"$RUNNER_TEMP/specimens-preview.log" 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.1
          done

          node scripts/visual-review.mjs
          MOBILE_CHROME_PORT=9233 node scripts/mobile-quality-review.mjs

      - name: Commit hardening and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- apps/specimens/tsconfig.tsbuildinfo 2>/dev/null || true
          git rm .github/workflows/harden-visual-target-startup-once.yml
          git add scripts/visual-review.mjs scripts/verify-contracts.mjs
          git commit -m "fix(visual): wait for a real Chrome page target"
          git push origin HEAD:test/specimen-visual-review
