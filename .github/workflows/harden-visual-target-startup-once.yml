name: Harden visual target startup once

on:
  push:
    branches:
      - test/specimen-visual-review

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: test/specimen-visual-review

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Poll for a real CDP page target and add a regression contract
        run: |
          python - <<'PY'
          from pathlib import Path

          visual_path = Path("scripts/visual-review.mjs")
          visual = visual_path.read_text()

          function_start = visual.index("async function waitForJson(")
          function_end = visual.index("\n\nasync function waitForRender", function_start)
          page_target_function = '''async function waitForPageTarget(
            url,
            chromeProcess,
            output,
            timeoutMs = 30_000,
          ) {
            const deadline = Date.now() + timeoutMs;
            let lastObservation = "Chrome debugging endpoint was not reachable";

            while (Date.now() < deadline) {
              if (
                chromeProcess.exitCode !== null ||
                chromeProcess.signalCode !== null
              ) {
                const exit = chromeProcess.signalCode ?? chromeProcess.exitCode;
                const log = output.join("").trim();
                throw new Error(
                  `Chrome exited before exposing a page debugging target (${exit})${
                    log ? `:\\n${log}` : ""
                  }`,
                );
              }

              try {
                const response = await globalThis.fetch(url);
                if (response.ok) {
                  const targets = await response.json();
                  if (Array.isArray(targets)) {
                    const page = targets.find(
                      (target) =>
                        target.type === "page" && target.webSocketDebuggerUrl,
                    );
                    if (page) {
                      return page;
                    }
                    lastObservation = `${targets.length} target(s) available, none page-ready`;
                  } else {
                    lastObservation = "debugging endpoint returned a non-array payload";
                  }
                } else {
                  lastObservation = `${response.status} ${response.statusText}`;
                }
              } catch (error) {
                lastObservation = String(error);
              }

              await new Promise((resolve) => setTimeout(resolve, 150));
            }

            const log = output.join("").trim();
            throw new Error(
              `Chrome did not expose a page debugging target within ${timeoutMs}ms; last observation: ${lastObservation}${
                log ? `\\nChrome output:\\n${log}` : ""
              }`,
            );
          }'''
          visual = (
              visual[:function_start]
              + page_target_function
              + visual[function_end:]
          )

          startup_start = visual.index("  const targets = await waitForJson(")
          client_anchor = "  client = new CdpClient(page.webSocketDebuggerUrl);"
          startup_end = visual.index(client_anchor, startup_start)
          startup = '''  const page = await waitForPageTarget(
            `http://127.0.0.1:${debuggingPort}/json/list`,
            chrome,
            chromeOutput,
          );

          '''
          visual = visual[:startup_start] + startup + visual[startup_end:]
          visual_path.write_text(visual)

          contracts_path = Path("scripts/verify-contracts.mjs")
          contracts = contracts_path.read_text()

          variable_anchor = "  specimenApp,\n  button,"
          if variable_anchor not in contracts:
              raise SystemExit("contract variable anchor not found")
          contracts = contracts.replace(
              variable_anchor,
              "  specimenApp,\n  visualReview,\n  button,",
              1,
          )

          read_anchor = (
              '  read("apps/specimens/src/app.tsx"),\n'
              '  read("packages/ui/src/components/ui/button.tsx"),'
          )
          if read_anchor not in contracts:
              raise SystemExit("contract read anchor not found")
          contracts = contracts.replace(
              read_anchor,
              '  read("apps/specimens/src/app.tsx"),\n'
              '  read("scripts/visual-review.mjs"),\n'
              '  read("packages/ui/src/components/ui/button.tsx"),',
              1,
          )

          assertion_anchor = '''  [
            "specimen chrome avoids decorative gradients",
            !specimenCss.includes("gradient("),
          ],'''
          if assertion_anchor not in contracts:
              raise SystemExit("contract assertion anchor not found")
          contracts = contracts.replace(
              assertion_anchor,
              '''  [
            "visual review waits for a real Chrome page target",
            visualReview.includes("async function waitForPageTarget") &&
              visualReview.includes('target.type === "page"') &&
              visualReview.includes("chromeProcess.exitCode !== null") &&
              !visualReview.includes("async function waitForJson"),
          ],
          [
            "specimen chrome avoids decorative gradients",
            !specimenCss.includes("gradient("),
          ],''',
              1,
          )
          contracts_path.write_text(contracts)
          PY

      - name: Format and verify non-browser gates
        run: |
          pnpm exec prettier --write scripts/visual-review.mjs scripts/verify-contracts.mjs
          pnpm check

      - name: Set up Chrome for focused receipt verification
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: stable

      - name: Run visual and mobile receipt harnesses
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          preview_log="$RUNNER_TEMP/specimens-preview.log"
          pnpm --filter @opencoven/specimens preview \
            --host 127.0.0.1 \
            --port 4173 >"$preview_log" 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              ready=true
              break
            fi
            sleep 0.1
          done
          if [[ "$ready" != "true" ]]; then
            cat "$preview_log"
            exit 1
          fi

          node scripts/visual-review.mjs
          MOBILE_CHROME_PORT=9233 node scripts/mobile-quality-review.mjs

      - name: Commit hardening and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- apps/specimens/tsconfig.tsbuildinfo 2>/dev/null || true
          git rm .github/workflows/harden-visual-target-startup-once.yml
          git add scripts/visual-review.mjs scripts/verify-contracts.mjs
          git commit -m "fix(visual): wait for a real Chrome page target"
          git push origin HEAD:test/specimen-visual-review
