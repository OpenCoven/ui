name: Format mobile gate once

on:
  push:
    branches:
      - test/specimen-visual-review

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/specimen-visual-review
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier scripts/mobile-quality-review.mjs --write
      - name: Commit formatter output and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-mobile-gate-once.yml
          git add scripts/mobile-quality-review.mjs
          git commit -m "style(visual): apply repository formatter"
          git push origin HEAD:test/specimen-visual-review
