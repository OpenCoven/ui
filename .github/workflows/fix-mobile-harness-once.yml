name: Fix mobile harness once

on:
  push:
    branches:
      - test/specimen-visual-review

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/specimen-visual-review
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch lint and teardown race
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/mobile-quality-review.mjs")
          text = path.read_text()
          text = text.replace(
              "    } catch {}\n    await sleep(100);",
              "    } catch {\n      // Chrome may not have exposed the debugging endpoint yet.\n    }\n    await sleep(100);",
              1,
          )
          text = text.replace(
              "  socket?.close();\n  chrome.kill();\n  await rm(profile, { recursive: true, force: true });",
              "  socket?.close();\n  chrome.kill();\n  await new Promise((resolve) => {\n    if (chrome.exitCode !== null) {\n      resolve();\n      return;\n    }\n    const timeout = setTimeout(resolve, 2000);\n    chrome.once(\"exit\", () => {\n      clearTimeout(timeout);\n      resolve();\n    });\n  });\n  for (let attempt = 0; attempt < 5; attempt += 1) {\n    try {\n      await rm(profile, { recursive: true, force: true });\n      break;\n    } catch (error) {\n      if (attempt === 4) throw error;\n      await sleep(100 * (attempt + 1));\n    }\n  }",
              1,
          )
          path.write_text(text)
          PY
      - run: pnpm exec prettier scripts/mobile-quality-review.mjs --write
      - run: pnpm exec eslint scripts/mobile-quality-review.mjs
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-mobile-harness-once.yml
          git add scripts/mobile-quality-review.mjs
          git commit -m "fix(visual): harden mobile harness cleanup"
          git push origin HEAD:test/specimen-visual-review
