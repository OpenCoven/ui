name: Materialize PR 3 generated artifacts

on:
  push:
    branches:
      - feat/developer-surface-system

permissions:
  contents: write

concurrency:
  group: materialize-pr3
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/developer-surface-system
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format patched sources
        run: |
          pnpm exec prettier --write \
            .github/workflows/visual-review.yml \
            apps/specimens/src/developer-showcase.tsx \
            docs/developer-surface.md \
            handoffs/visual-review.md \
            package.json \
            packages/ui/src/blocks/developer-surface.tsx \
            packages/ui/src/components/command-receipt.tsx \
            packages/ui/src/components/connection-status.tsx \
            packages/ui/tests/developer-surface.test.tsx \
            registry/developer/registry.fragment.json \
            scripts/check-registry-clean.mjs \
            scripts/developer-visual-review.mjs \
            scripts/verify-contracts.mjs \
            vercel.json

      - name: Generate registry artifacts
        run: pnpm registry:build

      - name: Verify generated script syntax and formatting
        run: |
          node --check scripts/check-registry-clean.mjs
          node --check scripts/developer-visual-review.mjs
          node --check scripts/verify-contracts.mjs
          pnpm format:check

      - name: Commit canonical generated output
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/visual-review.yml \
            apps/specimens/src/developer-showcase.tsx \
            docs/developer-surface.md \
            handoffs/visual-review.md \
            package.json \
            packages/ui/src/blocks/developer-surface.tsx \
            packages/ui/src/components/command-receipt.tsx \
            packages/ui/src/components/connection-status.tsx \
            packages/ui/tests/developer-surface.test.tsx \
            registry/developer/registry.fragment.json \
            scripts/check-registry-clean.mjs \
            scripts/developer-visual-review.mjs \
            scripts/verify-contracts.mjs \
            vercel.json \
            registry.json \
            public/r

          if git diff --cached --quiet; then
            echo 'Canonical artifacts already match.'
            exit 0
          fi

          git commit -m 'chore(registry): materialize developer surface artifacts'
          git push origin HEAD:feat/developer-surface-system
